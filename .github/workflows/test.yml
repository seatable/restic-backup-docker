name: Test

# Runs on every push and pull request (the image build in build-image-on-push.yml only runs on tags).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning -x backup.sh check.sh prune.sh entry.sh cron-run.sh pre-default.sh log.sh functions.sh tests/run.sh tests/fake-restic.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run the test suite
        run: tests/run.sh
